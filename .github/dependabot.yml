version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Longer than pnpm's default minimumReleaseAge (1 day), so an update
    # never proposes a version that `pnpm install` refuses.
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL fails when its init and analyze steps run different versions,
    # so one pull request updates every github/codeql-action step.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
    commit-message:
      prefix: ci
