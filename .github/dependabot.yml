version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Longer than pnpm's default minimumReleaseAge (1 day), so an update
    # never proposes a version that `pnpm install` refuses.
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
