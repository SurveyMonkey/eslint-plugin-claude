name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing: npm exchanges this job's OIDC token for a
  # short-lived publish token. No NPM_TOKEN secret exists. The trusted
  # publisher on npmjs.com names this repository and `release.yml`.
  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs pnpm from packageManager, Node from .nvmrc (or the
      # runtime input), then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # pnpm 11 and later do the OIDC exchange in `pnpm publish` itself.
      # `prepack` runs the build.
      - run: pnpm publish
