name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job itself needs nothing from GITHUB_TOKEN: release-please acts as
    # the GitHub App below.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # A short-lived token for the org's release app, installed on this
      # repository only. GitHub starts no workflow for a pull request that
      # GITHUB_TOKEN opens, so a release pull request made with it never gets
      # the checks the rulesets require. The permissions narrow the token to
      # what release-please uses.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing: npm exchanges this job's OIDC token for a
  # short-lived publish token. No NPM_TOKEN secret exists. The trusted
  # publisher on npmjs.com names this repository and `release.yml`.
  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        # No dependency cache in the job that publishes, so a poisoned cache
        # cannot reach the tarball.
        with:
          require-lockfile: true
      # pnpm 11 and later do the OIDC exchange in `pnpm publish` itself.
      # `prepack` runs the build.
      - run: pnpm publish
