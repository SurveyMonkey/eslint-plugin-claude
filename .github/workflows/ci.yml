name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THESE CHECK NAMES ARE A CONTRACT. The repo ruleset "Require CI" (24195202)
# requires every `test (node ...)` leg and every `check` matrix name, matched
# by exact string. Renaming one, or changing a Node version in the matrix,
# does not fail the build: the required check simply never reports, and
# every pull request waits. Update the ruleset in the same change.
# `docs-snapshot` is new. A person adds it to the ruleset after the merge
# that adds the job. A required name that no job reports blocks every pull
# request.
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The 22.x floor from engines.node, the latest 24.x, and the current line.
      matrix:
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, and Node from the runtime input or
      # devEngines.runtime (22.18.0). require-lockfile adds --frozen-lockfile
      # to the install.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm test
      # Packs the tarball (prepack runs the build), installs it with its eslint,
      # @eslint/markdown and @eslint/json peers into an empty directory, and
      # lints a Markdown and a JSON file there with each config. This catches a
      # `files` or `exports` mistake, and runs the built code on each Node.
      - name: Smoke-test the packed package
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          pnpm pack --pack-destination "$smoke"
          cp scripts/smoke.mjs "$smoke/"
          cd "$smoke"
          echo '{ "private": true, "type": "module" }' > package.json
          pnpm add ./eslint-plugin-claude-*.tgz "eslint@$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies.eslint")" "@eslint/markdown@$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies['@eslint/markdown']")" "@eslint/json@$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies['@eslint/json']")"
          node smoke.mjs

  # One check per tool, so each shows on the pull request and a ruleset can
  # require it by name.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: pnpm lint
          - name: typecheck
            run: pnpm typecheck
          # Unused files, exports and dependencies: a default run, then a
          # --strict (production) run over src/ only. The script builds first,
          # because --strict reads dist/*.d.ts to see which type imports reach
          # consumers.
          - name: knip
            run: pnpm knip
          - name: publint
            run: pnpm publint
          - name: docs
            run: pnpm docs:check
          - name: lefthook
            run: pnpm exec lefthook validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: ${{ matrix.run }}

  # The docs watch gate (scripts/docs-verify.ts). It runs on each pull
  # request, because a required check cannot use a path filter. It passes at
  # once when the diff does not change the docs watch state. Else it runs the
  # docs watch again, in dry run, against the base state. It fails when the
  # pull request stores a docs change that no open issue or group issue
  # comment names. It also fails when the head snapshot is not the live docs.
  docs-snapshot:
    name: docs-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      # On a push the job passes. A trigger that a later change adds fails
      # until the job has a step for it.
      - name: Pass on a push
        if: github.event_name == 'push'
        run: echo "docs-snapshot runs on a pull request only. A push has no base to compare. Pass."
      - name: Fail on another event
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "docs-snapshot has no step for the event $EVENT. Add one."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The gate reads the base commit, and the diff from the base.
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: github.event_name == 'pull_request'
        with:
          cache: true
          require-lockfile: true
      # The TypeSafe key goes to this step only. A pull request from a fork
      # or from Dependabot gets no secret, so a change to the state fails.
      - name: Check the docs snapshot against the base and the live docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/docs-verify.ts "$BASE_SHA"
