name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are a contract once a ruleset requires them. Rename with care.
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The floor of each range in engines.node, plus the current line.
      matrix:
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, Node from .nvmrc (or the
      # runtime input), then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm test

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, Node from .nvmrc (or the
      # runtime input), then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Validate lefthook.yml
        run: pnpm exec lefthook validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Import the built plugin
        run: node --input-type=module -e "const p = (await import('eslint-plugin-claude')).default; if (p.meta.name !== 'eslint-plugin-claude') process.exit(1)"
      - run: pnpm publint
