name: Claude Code docs watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print each issue that would open, and open none.
        type: boolean
        default: false

permissions:
  contents: read

# The job commits nothing, and it never changes the snapshot. When a docs
# page changed, or the check failed, it classifies the pages and opens an
# issue for a changed block. The uncited new-rule and needs-triage blocks of
# one page share one digest issue. A block that an inventory row cites, and
# that no map heading of a section cites, also gets a comment on its group issue,
# while that issue is open. Then a finding of the block that names no rule
# opens no issue. A scheduled run opens issues and posts comments. A manual
# run does too, unless `dry_run` is set. See CONTRIBUTING.md and the triage runbook.
jobs:
  check-docs:
    name: Check Claude Code docs for rule changes
    # The job is short (under a minute) and needs no privileges. The single-CPU
    # container runner has a 15 minute job limit, which is the timeout below.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # Node comes from devEngines.runtime in package.json (22.18.0). It must
      # be 22.18 or later, to run a .ts file.
      # A changed page gives exit 0. See the header of scripts/docs-watch.ts
      # for the cases that give exit 1. The classifier reads the pages again
      # and handles a lost or doubled heading, so the job goes on after a
      # failure here.
      - name: Compare the docs pages with the snapshot
        id: check
        continue-on-error: true
        run: node scripts/docs-watch.ts check > "$RUNNER_TEMP/docs-watch.json"
      # Classify when the check failed, or when its report shows a change or
      # an error. A check with an error exits 1 today, so the error test is a
      # guard. A report that node cannot read fails this step and the job.
      - name: Decide whether to classify
        id: gate
        env:
          CHECK: ${{ steps.check.outcome }}
        run: |
          classify=true
          if [ "$CHECK" = "success" ]; then
            classify=$(node -e "const r = require(process.argv[1]); if (!Number.isInteger(r.changed) || !Array.isArray(r.errors)) throw new Error('the check report has no changed count or errors list'); console.log(r.changed > 0 || r.errors.length > 0)" "$RUNNER_TEMP/docs-watch.json")
          fi
          echo "classify=$classify" >> "$GITHUB_OUTPUT"
      # The TypeSafe key goes to this step only, as an environment variable.
      - name: Classify the changed blocks
        if: steps.gate.outputs.classify == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/docs-classify.ts > "$RUNNER_TEMP/docs-findings.json"
      # A short-lived token for the org GitHub App, as in release.yml. It can
      # write issues and issue comments, and nothing else.
      - name: Get a token that can write issues
        id: app-token
        if: steps.gate.outputs.classify == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Open the issues for the changed blocks, or comment on their group issues
        if: steps.gate.outputs.classify == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/docs-issues.ts "$RUNNER_TEMP/docs-findings.json" --dry-run
          else
            node scripts/docs-issues.ts "$RUNNER_TEMP/docs-findings.json"
          fi
