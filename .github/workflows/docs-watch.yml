name: Docs watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# This workflow only reports. It opens no issue and commits nothing. It
# writes the report to the run summary. Only `update` mode writes the
# snapshot, and a person runs that mode. See CONTRIBUTING.md.
jobs:
  docs-watch:
    name: docs-watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # Node comes from .nvmrc. It must be 22.18 or later, to run a .ts file.
      # A changed page gives exit 0. A person reads the run summary. See the
      # header of scripts/docs-watch.ts for the cases that give exit 1.
      - run: node scripts/docs-watch.ts check
