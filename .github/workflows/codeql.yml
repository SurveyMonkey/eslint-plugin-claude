name: CodeQL

on:
  push:
    branches: [main]
  # Every base branch, so that each layer of a stack has a run on its head.
  # When a lower layer merges, GitHub moves the next layer to main. The
  # "edited" event of that move starts no run, so the run must exist before.
  # ready_for_review starts the run that a draft skipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '36 20 * * 5'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THESE CHECK NAMES ARE A CONTRACT. The repo ruleset "Require CodeQL"
  # (24195745) requires `Analyze (actions)` and `Analyze
  # (javascript-typescript)` by exact string. Renaming the job or changing
  # the language list does not fail the build: the required check never
  # reports, and every pull request waits. Update the ruleset in the same
  # change.
  analyze:
    name: Analyze (${{ matrix.language }})
    # A draft gets no run, so its required checks do not report. A draft
    # cannot merge. ready_for_review starts the run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Both need no build: `actions` reads the workflows, and
        # `javascript-typescript` reads the source.
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
