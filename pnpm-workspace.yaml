# pnpm settings. pnpm 11 and later read them only from here, not from the
# `pnpm` field of package.json or from .npmrc (which is auth and registry only).

# Refuse an install when this package or a dependency declares engines that
# the running Node does not satisfy.
engineStrict: true

# lefthook's postinstall installs the git hooks. No other dependency may run
# a build script.
allowBuilds:
  lefthook: true

# Refuse a dependency version whose supply-chain trust evidence is weaker than
# an earlier version's (for example, lost provenance).
trustPolicy: no-downgrade
trustPolicyExclude:
  # @types/node@22 dependency. 6.21.0 (2024-11-13, published by the undici
  # maintainer) has no provenance; an earlier version does.
  - undici-types@6.21.0
# pnpm drops an exclusion above once the lockfile no longer resolves it.
trustPolicyExcludePrune: true

# Pin transitive dependencies to versions with security patches. Remove an
# entry when its parent package accepts the patched version.
overrides:
  # GHSA-238p-pmpm-9mq7, through @eslint/markdown > micromark-extension-math.
  katex@<0.18.2: ^0.18.2
  # GHSA-g3hv-75wg-m249, through eslint, typescript-eslint and editorconfig.
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  # GHSA-mrhx-c7xc-m3w5, through knip.
  zod@<4.6.6: ^4.6.6
