# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
#
# Fast gates. biome and vitest see staged files only; tsc checks the whole
# project. CI is the enforcement boundary. sort-package-json is the one job
# that edits: it sorts a staged package.json and re-stages it.
# `pnpm install` installs the hooks through lefthook's postinstall.
pre-commit:
  jobs:
    - name: sort-package-json
      glob: 'package.json'
      # pnpm dlx, not a devDependency. The version is pinned here so every
      # contributor sorts the same way.
      run: pnpm dlx sort-package-json@4.0.0 {staged_files}
      stage_fixed: true
    - name: biome
      glob: '*.{json,jsonc,ts}'
      run: pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
    - name: types
      glob: '{*.ts,tsconfig*.json}'
      run: pnpm exec tsc -p tsconfig.json
    - name: vitest-staged
      glob: '*.ts'
      # Maps each staged path to one test file. It does not use the import
      # graph, because src/index.ts imports every rule.
      #   src/rules/<name>.ts              -> tests/rules/<name>.test.ts
      #   src/<name>.ts, scripts/<name>.ts -> tests/<name>.test.ts
      #   a staged *.test.ts               -> itself
      # A path with no test file runs no test. So does a file in a folder of
      # src/ other than rules/.
      run: |
        tests=""
        for f in {staged_files}; do
          name=$(basename "$f" .ts)
          case "$f" in
            src/rules/*.ts) t="tests/rules/$name.test.ts" ;;
            src/*/*) t="" ;;
            src/*.ts | scripts/*.ts) t="tests/$name.test.ts" ;;
            tests/*.test.ts) t="$f" ;;
            *) t="" ;;
          esac
          if [ -n "$t" ] && [ -f "$t" ]; then tests="$tests $t"; fi
        done
        if [ -n "$tests" ]; then pnpm exec vitest run $tests; fi
